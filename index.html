<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sesli Ajanda</title>
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f5f1; --surface:#ffffff; --line:#dfe4dc; --fg:#1d2620; --muted:#66716a;
  --accent:#2f6b4f; --accent-ink:#ffffff; --accent-soft:#e2eee7;
  --red:#b83a2e; --red-soft:#f8e3df; --amber:#a86a12; --amber-soft:#f6ecd8;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121815; --surface:#1a221e; --line:#2b3530; --fg:#e6ece8; --muted:#97a39c;
  --accent:#6fbf95; --accent-ink:#0e1a14; --accent-soft:#1f3329;
  --red:#ee7f72; --red-soft:#3a201d; --amber:#e3ae5a; --amber-soft:#382b17; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.9rem;margin:0;letter-spacing:-.01em}
.date{color:var(--muted);font-size:.9rem}
.counts{font-size:.85rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.counts b{color:var(--fg);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .95rem var(--body);padding:10px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
#mic{flex:none;width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;transition:background .2s}
#mic.on{background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--red-soft)}70%{box-shadow:0 0 0 14px transparent}}
@media (prefers-reduced-motion: reduce){#mic.on{animation:none}}
#txt{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:12px;font:1rem var(--body);resize:none;min-height:64px}
#txt:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{font-size:.82rem;color:var(--muted);flex:1;min-width:180px}
#add{border:0;background:var(--fg);color:var(--bg);font:600 .95rem var(--body);padding:10px 18px;border-radius:10px;cursor:pointer}
.status{font-size:.85rem;color:var(--accent);min-height:1.2em}
.status.err{color:var(--red)}
section h2{font:600 .78rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between}
section h2.late{color:var(--red)}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 12px 12px 10px;border-top:1px solid var(--line);position:relative}
li:first-child{border-top:0}
li.p-yuksek::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--red)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--accent-ink);margin-top:1px;padding:0}
li.done .chk{background:var(--accent);border-color:var(--accent)}
.t{min-width:0;overflow-wrap:anywhere}
.t .title{font-weight:500}
li.done .title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.chip.late,.chip.hi{background:var(--red-soft);color:var(--red)}
.chip.lo{background:var(--amber-soft);color:var(--amber)}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;font:.8rem var(--body);padding:4px 6px;border-radius:6px}
.del.arm{background:var(--red);color:#fff}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted);text-align:center}
.empty strong{display:block;color:var(--fg);font-family:var(--display);font-size:1.15rem;margin-bottom:4px}
details summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:4px 0}
details[open] summary{margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Sesli Ajanda</h1>
      <div class="date" id="today"></div>
    </div>
    <div class="counts" id="counts"></div>
  </header>

  <div class="seg" role="group" aria-label="Liste">
    <button id="tab-yapilacak" aria-pressed="true">Yapılacaklar</button>
    <button id="tab-gorev" aria-pressed="false">Görevler</button>
  </div>

  <div class="composer">
    <div class="row">
      <button id="mic" aria-label="Sesle ekle" title="Sesle ekle">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <textarea id="txt" rows="2" placeholder="Örn: Yarın saat 10'da Konya'daki çiftliğe robot bakımı, acil"></textarea>
    </div>
    <div class="actions">
      <div class="hint" id="hint">Mikrofona basın ve söyleyin. Bitince kendisi ekler.</div>
      <button id="add">Ekle</button>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>

  <div id="lists"></div>
</div>

<script>
const TR_DAYS=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const TR_MON=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
let now,todayIso,tmrIso;
function refreshDates(){ now=new Date(); todayIso=iso(now); const t=new Date(now); t.setDate(now.getDate()+1); tmrIso=iso(t);
  $("#today").textContent=now.getDate()+" "+TR_MON[now.getMonth()]+" "+now.getFullYear()+", "+TR_DAYS[now.getDay()]; }
refreshDates();

let list="yapilacak", tasks=[];
try{ tasks=JSON.parse(localStorage.getItem("sa-tasks")||"[]"); }catch(e){ tasks=[]; }
try{ const l=localStorage.getItem("sa-list"); if(l==="gorev"||l==="yapilacak") list=l; }catch(e){}
function save(){ try{ localStorage.setItem("sa-tasks",JSON.stringify(tasks)); }catch(e){ status("Kaydedilemedi: telefonun depolama alanını kontrol edin.",true); } }

function setTab(l){ list=l; try{localStorage.setItem("sa-list",l)}catch(e){}
  $("#tab-yapilacak").setAttribute("aria-pressed",l==="yapilacak"); $("#tab-gorev").setAttribute("aria-pressed",l==="gorev"); render(); }
$("#tab-yapilacak").onclick=()=>setTab("yapilacak"); $("#tab-gorev").onclick=()=>setTab("gorev");
function status(msg,err){ const s=$("#status"); s.textContent=msg||""; s.className="status"+(err?" err":""); }

function fmtDue(t){
  if(!t.due) return t.time||null;
  let label;
  if(t.due===todayIso) label="Bugün"; else if(t.due===tmrIso) label="Yarın";
  else { const d=new Date(t.due+"T00:00"); label=d.getDate()+" "+TR_MON[d.getMonth()].slice(0,3)+" "+TR_DAYS[d.getDay()].slice(0,3); }
  return label+(t.time?" "+t.time:"");
}

function itemEl(t){
  const late=!t.done && t.due && t.due<todayIso, due=fmtDue(t);
  const pr=t.priority==="yuksek"?'<span class="chip hi">Acil</span>':t.priority==="dusuk"?'<span class="chip lo">Düşük</span>':"";
  const li=document.createElement("li");
  li.className=(t.done?"done ":"")+"p-"+(t.priority||"normal");
  li.innerHTML=`<button class="chk" aria-label="${t.done?"Geri al":"Tamamlandı"}">${t.done?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg>':""}</button>
    <div class="t"><div class="title"></div><div class="meta">${due?`<span class="chip ${late?"late":""}">${late?"Gecikti · ":""}${due}</span>`:""}${pr}</div></div>
    <button class="del" aria-label="Sil">Sil</button>`;
  li.querySelector(".title").textContent=t.title;
  li.querySelector(".chk").onclick=()=>{ t.done=!t.done; t.doneAt=t.done?Date.now():null; save(); render(); };
  const del=li.querySelector(".del");
  del.onclick=()=>{ if(del.classList.contains("arm")){ tasks=tasks.filter(x=>x!==t); save(); render(); return; }
    del.classList.add("arm"); del.textContent="Emin misiniz?"; setTimeout(()=>{del.classList.remove("arm");del.textContent="Sil"},3000); };
  return li;
}
const sortKey=t=>(t.due||"9999-99-99")+" "+(t.time||"99:99")+" "+(t.priority==="yuksek"?0:t.priority==="dusuk"?2:1);

function render(){
  const box=$("#lists"); box.innerHTML="";
  const mine=tasks.filter(t=>(t.list||"yapilacak")===list);
  const open=mine.filter(t=>!t.done).sort((a,b)=>sortKey(a)<sortKey(b)?-1:1);
  const done=mine.filter(t=>t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const allOpen=tasks.filter(t=>!t.done);
  $("#counts").innerHTML=`<b>${allOpen.filter(t=>t.due===todayIso).length}</b> bugün<br><b>${allOpen.filter(t=>t.due&&t.due<todayIso).length}</b> gecikmiş`;
  if(!mine.length){
    box.innerHTML=`<div class="empty"><strong>${list==="gorev"?"Görev listeniz boş":"Yapılacaklar listeniz boş"}</strong>Mikrofona basıp söyleyin, ya da yazıp Ekle'ye dokunun.</div>`; return; }
  const groups=[["Gecikmiş",open.filter(t=>t.due&&t.due<todayIso),"late"],["Bugün",open.filter(t=>t.due===todayIso)],
    ["Yarın",open.filter(t=>t.due===tmrIso)],["Yakında",open.filter(t=>t.due&&t.due>tmrIso)],["Tarihsiz",open.filter(t=>!t.due)]];
  for(const [name,items,cls] of groups){ if(!items.length) continue;
    const s=document.createElement("section"); s.innerHTML=`<h2 class="${cls||""}"><span>${name}</span><span>${items.length}</span></h2>`;
    const ul=document.createElement("ul"); items.forEach(t=>ul.appendChild(itemEl(t))); s.appendChild(ul); box.appendChild(s); }
  if(done.length){ const d=document.createElement("details"); d.innerHTML=`<summary>Tamamlananlar (${done.length})</summary>`;
    const ul=document.createElement("ul"); done.forEach(t=>ul.appendChild(itemEl(t))); d.appendChild(ul); box.appendChild(d); }
}

/* ---------- Türkçe ifadeleri ayırma ---------- */
const DAYMAP={"pazartesi":1,"salı":2,"çarşamba":3,"perşembe":4,"cuma":5,"cumartesi":6,"pazar":0};
const MONMAP={"ocak":0,"şubat":1,"mart":2,"nisan":3,"mayıs":4,"haziran":5,"temmuz":6,"ağustos":7,"eylül":8,"ekim":9,"kasım":10,"aralık":11};
const NUMW={"bir":1,"iki":2,"üç":3,"dört":4,"beş":5,"altı":6,"yedi":7,"sekiz":8,"dokuz":9,"on":10,"on bir":11,"on iki":12};
function parse(text){
  let s=" "+text.trim()+" ", low=s.toLocaleLowerCase("tr");
  let due=null,time=null,priority="normal",l=list;
  const cut=re=>{ const m=low.match(re); if(m){ const i=m.index; s=s.slice(0,i)+" "+s.slice(i+m[0].length); low=low.slice(0,i)+" "+low.slice(i+m[0].length); } return m; };
  const add=n=>{ const d=new Date(now); d.setDate(d.getDate()+n); return iso(d); };
  let m;
  // liste
  if(cut(/\s(görevlere|görev listesine|görev olarak)(\s+ekle)?(?=[\s,.]|$)/)) l="gorev";
  else if(cut(/\s(yapılacaklara|yapılacak listesine|yapılacak olarak)(\s+ekle)?(?=[\s,.]|$)/)) l="yapilacak";
  // öncelik
  if(cut(/[\s,]*(çok\s+)?(acil|önemli|öncelikli|hemen)(\s+olarak)?(?=[\s,.]|$)/)) priority="yuksek";
  else if(cut(/[\s,]*(acelesi yok|vakit olunca|boş vakitte|düşük öncelik(li)?)(?=[\s,.]|$)/)) priority="dusuk";
  // tarih
  if(cut(/\s(bugün)(kü)?\s*/)) due=todayIso;
  else if(cut(/\s(yarından sonra|öbür gün)\s*/)) due=add(2);
  else if(cut(/\s(yarın)\s*/)) due=add(1);
  else if(m=cut(/\s(haftaya|gelecek hafta|önümüzdeki)?\s*(pazartesi|salı|çarşamba|perşembe|cumartesi|cuma|pazar)(\s*günü)?(ye|ya|e|a|ne|na|si|sı)?\s*/)){
    let diff=(DAYMAP[m[2]]-now.getDay()+7)%7; if(diff===0) diff=7; if(m[1] && diff<7) diff+=7; due=add(diff); }
  else if(m=cut(/\s(\d{1,2})\s+(ocak|şubat|mart|nisan|mayıs|haziran|temmuz|ağustos|eylül|ekim|kasım|aralık)('?[a-zıüşöç]*)?\s*/)){
    let d=new Date(now.getFullYear(),MONMAP[m[2]],+m[1]); if(iso(d)<todayIso) d.setFullYear(d.getFullYear()+1); due=iso(d); }
  else if(m=cut(/\s(\d+|bir|iki|üç|dört|beş|altı|yedi)\s+gün\s+sonra\s*/)){ due=add(+(NUMW[m[1]]||m[1])); }
  else if(cut(/\s(haftaya|gelecek hafta)\s*/)) due=add(7);
  // saat
  let pm=false, part=null;
  if(m=cut(/\s(sabah|öğleden sonra|öğlen|akşam|gece)\s+(saat\s*)?(\d{1,2})(?:[:.](\d{2}))?('?[a-zıüşöç]*)?\s*/)){ part=[m[0],m[1]]; time=[+m[3],+(m[4]||0)]; }
  else part=cut(/\s(sabah|öğleden sonra|öğlen|akşam|gece)\s*/);
  if(part && /öğleden sonra|akşam|gece/.test(part[1])) pm=true;
  if(time){}
  else if(m=cut(/\s(saat\s*)?(\d{1,2})[:.](\d{2})('?[a-zıüşöç]*)?\s*/)) time=[+m[2],+m[3]];
  else if(m=cut(/\s(saat\s*)(\d{1,2})('?[a-zıüşöç]*)?\s*/)) time=[+m[2],0];
  else if(m=cut(/\ssaat\s+(on iki|on bir|on|bir|iki|üç|dört|beş|altı|yedi|sekiz|dokuz)('?[a-zıüşöç]*)?\s*/)) time=[NUMW[m[1]],0];
  if(!time && part) time=part[1]==="sabah"?[9,0]:part[1]==="öğlen"?[12,0]:part[1]==="akşam"?[19,0]:part[1]==="gece"?[21,0]:[15,0];
  if(time){ let [h,mi]=time; if(pm && h<12) h+=12; time=pad(h)+":"+pad(mi); }
  let title=s.replace(/\s+/g," ").replace(/^[\s,.;-]+|[\s,.;-]+$/g,"");
  if(!title) title=text.trim();
  title=title.charAt(0).toLocaleUpperCase("tr")+title.slice(1);
  return {title,due,time,priority,list:l};
}
function splitItems(text){
  return text.split(/\s*(?:[;\n]|\bbir de\b|\bayrıca\b|\bsonra da\b)\s*/i).map(x=>x.trim()).filter(x=>x.length>1);
}

function submit(){
  refreshDates();
  const text=$("#txt").value.trim(); if(!text) return;
  const items=splitItems(text).map(parse);
  for(const it of items){ it.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6); it.done=false; it.createdAt=Date.now(); tasks.push(it); }
  save(); $("#txt").value=""; render();
  const other=items.some(i=>i.list!==list)?" (bir kısmı diğer listede)":"";
  status(items.length>1?`${items.length} iş eklendi${other}.`:`Eklendi${other}: ${items[0].title}`);
}
$("#add").onclick=submit;
$("#txt").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); submit(); } });

/* ---------- ses ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null, listening=false, heard="";
if(!SR) $("#hint").textContent="Bu tarayıcı sesli yazmayı desteklemiyor. Chrome ile açın ya da klavyedeki mikrofonu kullanın.";
$("#mic").onclick=()=>{
  if(listening){ try{rec.stop()}catch(e){} return; }
  if(!SR){ $("#txt").focus(); return; }
  rec=new SR(); rec.lang="tr-TR"; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
  const base=$("#txt").value?$("#txt").value.trim()+" ":""; heard="";
  rec.onresult=e=>{ let s=""; for(const r of e.results) s+=r[0].transcript; heard=s; $("#txt").value=base+s; };
  rec.onerror=e=>{ const msg={"not-allowed":"Mikrofon izni verilmedi. Adres çubuğundaki kilit simgesinden mikrofona izin verin.","no-speech":"Ses duyulmadı, tekrar deneyin.","network":"Ses tanıma için internet bağlantısı gerekiyor."}[e.error]||"Ses alınamadı, tekrar deneyin.";
    status(msg,true); };
  rec.onend=()=>{ listening=false; $("#mic").classList.remove("on"); if(heard.trim()) submit(); else if($("#status").textContent==="Dinliyorum…") status(""); };
  try{ rec.start(); listening=true; $("#mic").classList.add("on"); status("Dinliyorum…"); }catch(e){ status("Mikrofon başlatılamadı, tekrar deneyin.",true); }
};

render();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ refreshDates(); render(); } });
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
